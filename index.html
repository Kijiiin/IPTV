<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 IPTV Italia - Preferiti</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
            background: #f0f2f5;
        }
        .container {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #1a1a2e;
            margin-top: 0;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }
        .controls input, .controls select {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d0d7de;
            border-radius: 10px;
            font-size: 15px;
            background: #fafbfc;
            min-width: 150px;
        }
        .controls input:focus, .controls select:focus {
            outline: 2px solid #0969da;
            border-color: transparent;
        }
        .btn-fav {
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #ffb800;
            background: white;
            font-weight: 600;
            cursor: pointer;
            color: #8a6d00;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-fav.active {
            background: #ffb800;
            color: #1a1a2e;
            border-color: #ffb800;
        }

        /* LISTA CANALI */
        .channel-list {
            max-height: 450px;
            overflow-y: auto;
            border: 1px solid #d0d7de;
            border-radius: 12px;
            background: #fafbfc;
        }
        .channel-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            border-bottom: 1px solid #e9ecef;
            cursor: pointer;
            transition: background 0.15s;
        }
        .channel-item:hover {
            background: #eef2f7;
        }
        .channel-item.active-channel {
            background: #0969da;
            color: white;
        }
        .channel-item.active-channel .fav-star {
            color: white;
        }
        .channel-item .info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }
        .channel-item .info .name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel-logo {
            width: 30px;
            height: 30px;
            object-fit: contain;
            border-radius: 6px;
            background: white;
            flex-shrink: 0;
        }
        .fav-star {
            font-size: 24px;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
            margin-left: 10px;
            transition: transform 0.15s;
            background: none;
            border: none;
            padding: 0 4px;
            line-height: 1;
        }
        .fav-star:hover {
            transform: scale(1.3);
        }
        .fav-star.inactive {
            color: #ccc;
        }
        .fav-star.active {
            color: #ffb800;
            text-shadow: 0 0 10px rgba(255, 184, 0, 0.4);
        }
        .channel-item.active-channel .fav-star.active {
            color: #ffb800;
        }
        .channel-item.active-channel .fav-star.inactive {
            color: rgba(255,255,255,0.4);
        }

        .group-header {
            font-weight: bold;
            background: #e9ecef;
            padding: 6px 14px;
            color: #1a1a2e;
            font-size: 14px;
            border-bottom: 1px solid #d0d7de;
            display: flex;
            justify-content: space-between;
        }

        video {
            width: 100%;
            max-height: 520px;
            background: #0d1117;
            border-radius: 14px;
            margin-top: 16px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            font-size: 14px;
            color: #57606a;
            flex-wrap: wrap;
            gap: 8px;
        }
        .badge {
            background: #e1e4e8;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
        }
        .badge.fav-badge {
            background: #ffb800;
            color: #1a1a2e;
            font-weight: 600;
        }
        .info-box {
            background: #f6f8fa;
            padding: 12px 18px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 14px;
            border-left: 4px solid #0969da;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #8b949e;
        }
        .empty-msg {
            padding: 30px;
            text-align: center;
            color: #8b949e;
        }
        .loading-msg {
            padding: 30px;
            text-align: center;
            color: #57606a;
        }
        @media (max-width: 600px) {
            .channel-logo { width: 22px; height: 22px; }
            .fav-star { font-size: 20px; }
            .channel-item { padding: 6px 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📺 IPTV Italia <span style="font-size:20px; color:#ffb800;">⭐</span></h1>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="🔍 Cerca canale..." oninput="filterChannels()">
        <select id="groupSelect" onchange="filterChannels()">
            <option value="">📂 Tutti i gruppi</option>
        </select>
        <button class="btn-fav" id="showFavBtn">⭐ Solo preferiti</button>
    </div>

    <div class="channel-list" id="channelList">
        <div class="loading-msg">⏳ Caricamento in corso...</div>
    </div>

    <video id="videoPlayer" controls autoplay muted playsinline></video>

    <div class="status-bar">
        <span id="channelCounter">📡 Canali: 0</span>
        <span>
            <span class="badge" id="statusBadge">✅ Playlist locale</span>
            <span class="badge fav-badge" id="favCounter">⭐ 0 preferiti</span>
        </span>
    </div>

    <div class="info-box">
        ⭐ <strong>Clicca sulla stella</strong> per aggiungere/rimuovere dai preferiti. I preferiti si salvano automaticamente nel browser.
    </div>

    <div class="footer">
        Playlist: <strong>lista.m3u</strong> (nella stessa cartella)
    </div>
</div>

<script>
    // ============================================================
    //  CONFIGURAZIONE
    // ============================================================
    const M3U_FILE = 'lista.m3u';
    const STORAGE_KEY = 'iptv_favorites';

    // ============================================================
    //  VARIABILI
    // ============================================================
    let allChannels = [];
    let filteredChannels = [];
    let groups = new Set();
    let favorites = new Set();
    let hls = null;
    let showOnlyFavorites = false;
    let currentChannelIndex = -1;

    // DOM
    const channelList = document.getElementById('channelList');
    const videoPlayer = document.getElementById('videoPlayer');
    const searchInput = document.getElementById('searchInput');
    const groupSelect = document.getElementById('groupSelect');
    const channelCounter = document.getElementById('channelCounter');
    const statusBadge = document.getElementById('statusBadge');
    const favCounter = document.getElementById('favCounter');
    const showFavBtn = document.getElementById('showFavBtn');

    // ============================================================
    //  PREFERITI
    // ============================================================
    function loadFavorites() {
        try {
            const data = localStorage.getItem(STORAGE_KEY);
            favorites = data ? new Set(JSON.parse(data)) : new Set();
        } catch { favorites = new Set(); }
        updateFavUI();
    }

    function saveFavorites() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...favorites]));
        updateFavUI();
    }

    function toggleFavorite(channelId) {
        if (favorites.has(channelId)) favorites.delete(channelId);
        else favorites.add(channelId);
        saveFavorites();
        filterChannels();
    }

    function isFavorite(channelId) {
        return favorites.has(channelId);
    }

    function updateFavUI() {
        favCounter.textContent = `⭐ ${favorites.size} preferiti`;
        showFavBtn.textContent = showOnlyFavorites ? '⭐ Mostra tutti' : '⭐ Solo preferiti';
        showFavBtn.classList.toggle('active', showOnlyFavorites);
    }

    // ============================================================
    //  PARSER M3U
    // ============================================================
    function parseM3U(text) {
        const lines = text.split('\n');
        const channels = [];
        let current = null;
        let index = 0;

        for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed) continue;

            if (trimmed.startsWith('#EXTINF:')) {
                const nameMatch = trimmed.match(/,(.+)$/);
                const name = nameMatch ? nameMatch[1].trim() : 'Canale senza nome';

                const tvgIdMatch = trimmed.match(/tvg-id="([^"]*)"/);
                const tvgLogoMatch = trimmed.match(/tvg-logo="([^"]*)"/);
                const tvgGroupMatch = trimmed.match(/tvg-group="([^"]*)"/);

                current = {
                    id: `ch_${index++}`,
                    name: name,
                    tvgId: tvgIdMatch ? tvgIdMatch[1] : '',
                    logo: tvgLogoMatch ? tvgLogoMatch[1] : '',
                    group: tvgGroupMatch ? tvgGroupMatch[1] : 'Altro',
                    url: '',
                    userAgent: null
                };
            } else if (trimmed.startsWith('#EXTVLCOPT:http-user-agent=')) {
                if (current) {
                    const uaMatch = trimmed.match(/http-user-agent=(.+)$/);
                    if (uaMatch) current.userAgent = uaMatch[1];
                }
            } else if (!trimmed.startsWith('#') && current) {
                current.url = trimmed;
                if (current.url) channels.push(current);
                current = null;
            }
        }
        return channels;
    }

    // ============================================================
    //  CARICAMENTO
    // ============================================================
    function loadLocalPlaylist() {
        channelList.innerHTML = '<div class="loading-msg">⏳ Caricamento in corso...</div>';

        fetch(M3U_FILE)
            .then(response => {
                if (!response.ok) throw new Error(`File non trovato (HTTP ${response.status})`);
                return response.text();
            })
            .then(text => {
                const channels = parseM3U(text);
                if (channels.length === 0) throw new Error('Nessun canale trovato.');

                allChannels = channels;
                groups.clear();
                allChannels.forEach(ch => { if (ch.group) groups.add(ch.group); });

                groupSelect.innerHTML = '<option value="">📂 Tutti i gruppi</option>';
                [...groups].sort().forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g;
                    opt.textContent = g;
                    groupSelect.appendChild(opt);
                });

                loadFavorites();
                filterChannels();
                statusBadge.textContent = `✅ Caricati ${allChannels.length} canali`;
            })
            .catch(error => {
                console.error('Errore:', error);
                channelList.innerHTML = `
                    <div class="empty-msg">
                        ❌ <strong>Errore: ${error.message}</strong><br><br>
                        Assicurati che il file <strong>${M3U_FILE}</strong> sia nella STESSA CARTELLA di questo file HTML.
                        <br><br>
                        <a href="https://forgejo.it/peppenamir/iptv_italia/raw/branch/main/lista.m3u" target="_blank">⬇️ Scarica la playlist qui</a>
                    </div>
                `;
                statusBadge.textContent = '❌ Errore';
            });
    }

    // ============================================================
    //  FILTRO E RENDER
    // ============================================================
    function filterChannels() {
        const searchTerm = searchInput.value.toLowerCase().trim();
        const selectedGroup = groupSelect.value;

        filteredChannels = allChannels.filter(ch => {
            const matchName = ch.name.toLowerCase().includes(searchTerm);
            const matchGroup = selectedGroup === '' || ch.group === selectedGroup;
            const matchFav = showOnlyFavorites ? isFavorite(ch.id) : true;
            return matchName && matchGroup && matchFav;
        });

        // Ordina: preferiti prima
        filteredChannels.sort((a, b) => {
            const aFav = isFavorite(a.id);
            const bFav = isFavorite(b.id);
            if (aFav && !bFav) return -1;
            if (!aFav && bFav) return 1;
            return a.name.localeCompare(b.name);
        });

        renderChannels();
        channelCounter.textContent = `📡 Canali: ${filteredChannels.length} / ${allChannels.length}`;
        updateFavUI();
    }

    function renderChannels() {
        if (filteredChannels.length === 0) {
            channelList.innerHTML = `<div class="empty-msg">📭 Nessun canale trovato</div>`;
            return;
        }

        let html = '';
        let currentGroup = '';
        let favCount = filteredChannels.filter(ch => isFavorite(ch.id)).length;

        // Header preferiti
        if (favCount > 0 && !showOnlyFavorites) {
            html += `<div class="group-header" style="background:#fffbee; color:#8a6d00; border-left:4px solid #ffb800;">
                ⭐ I tuoi preferiti (${favCount})
            </div>`;
            filteredChannels.filter(ch => isFavorite(ch.id)).forEach((ch, idx) => {
                html += renderChannelItem(ch, idx);
            });
            // Separatore
            html += `<div style="border-bottom:2px dashed #d0d7de; margin:4px 0;"></div>`;
        }

        // Tutti i canali (esclusi i preferiti se già mostrati sopra)
        const channelsToShow = showOnlyFavorites 
            ? filteredChannels 
            : filteredChannels.filter(ch => !isFavorite(ch.id));

        channelsToShow.forEach((ch, idx) => {
            // Se è un preferito e siamo in modalità "solo preferiti", lo mostriamo comunque
            // (già filtrati sopra)
            if (ch.group !== currentGroup) {
                currentGroup = ch.group;
                html += `<div class="group-header">📁 ${ch.group}</div>`;
            }
            html += renderChannelItem(ch, idx);
        });

        channelList.innerHTML = html;
    }

    function renderChannelItem(ch, index) {
        const isFav = isFavorite(ch.id);
        const isActive = (currentChannelIndex === index);
        const logoHtml = ch.logo 
            ? `<img src="${ch.logo}" class="channel-logo" onerror="this.style.display='none'" loading="lazy">` 
            : '';

        const starClass = isFav ? 'active' : 'inactive';
        const starSymbol = isFav ? '⭐' : '☆';

        return `
            <div class="channel-item ${isActive ? 'active-channel' : ''}" data-index="${index}" onclick="selectChannel(${index})">
                <div class="info">
                    ${logoHtml}
                    <span class="name">${ch.name}</span>
                </div>
                <button class="fav-star ${starClass}" onclick="event.stopPropagation(); toggleFavoriteById('${ch.id}')" title="Aggiungi/rimuovi preferito">
                    ${starSymbol}
                </button>
            </div>
        `;
    }

    // ============================================================
    //  SELEZIONE CANALE
    // ============================================================
    function selectChannel(index) {
        currentChannelIndex = index;
        const channel = filteredChannels[index];
        if (!channel || !channel.url) return;

        // Aggiorna la UI
        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active-channel'));
        const items = document.querySelectorAll('.channel-item');
        if (items[index]) items[index].classList.add('active-channel');

        // Distruggi hls
        if (hls) { hls.destroy(); hls = null; }

        const url = channel.url;
        const isHls = url.includes('.m3u8');
        const isMpd = url.includes('.mpd');
        const isYoutube = url.includes('youtube.com') || url.includes('twitch.tv');

        if (isYoutube) {
            videoPlayer.pause();
            videoPlayer.src = '';
            alert(`⚠️ "${channel.name}" è un live YouTube/Twitch. Aprilo nel browser.`);
            return;
        }

        if (isMpd) {
            videoPlayer.pause();
            videoPlayer.src = '';
            alert(`⚠️ "${channel.name}" usa DASH (.mpd). Usa VLC.`);
            return;
        }

        if (isHls) {
            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(videoPlayer);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    videoPlayer.play().catch(e => console.warn(e));
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        console.error('Errore hls.js:', data);
                        alert(`❌ Impossibile riprodurre "${channel.name}". Potrebbe richiedere user-agent. Usa VLC.`);
                    }
                });
                return;
            }
        }

        videoPlayer.src = url;
        videoPlayer.play().catch(error => {
            console.warn('Riproduzione fallita:', error);
            if (channel.userAgent) {
                alert(`⚠️ "${channel.name}" richiede user-agent: ${channel.userAgent}. Usa VLC.`);
            }
        });
    }

    function toggleFavoriteById(id) {
        toggleFavorite(id);
    }

    // ============================================================
    //  PULSANTE PREFERITI
    // ============================================================
    showFavBtn.addEventListener('click', function() {
        showOnlyFavorites = !showOnlyFavorites;
        filterChannels();
    });

    // ============================================================
    //  AVVIO
    // ============================================================
    loadLocalPlaylist();
</script>
</body>
</html>
