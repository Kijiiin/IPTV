<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 IPTV Italia</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #0b0e14 0%, #141a24 50%, #1a2230 100%);
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Container principale - effetto vetro */
        .container {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            padding: 32px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-left .logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #ffb800, #f59e0b);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 8px 24px rgba(255, 184, 0, 0.25);
        }

        .header-left h1 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-left h1 span {
            color: #ffb800;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .header-right .badge {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 16px;
            border-radius: 100px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-weight: 500;
        }

        .header-right .badge strong {
            color: #ffb800;
            font-weight: 600;
        }

        /* Barra di controllo */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .controls input,
        .controls select {
            flex: 1;
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #e8edf4;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            min-width: 160px;
            outline: none;
        }

        .controls input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .controls input:focus,
        .controls select:focus {
            border-color: #ffb800;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 4px rgba(255, 184, 0, 0.08);
        }

        .controls select option {
            background: #1a2230;
            color: #e8edf4;
        }

        .btn-fav {
            padding: 12px 24px;
            border-radius: 14px;
            border: 1px solid rgba(255, 184, 0, 0.25);
            background: rgba(255, 184, 0, 0.06);
            color: #ffb800;
            font-weight: 600;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-fav:hover {
            background: rgba(255, 184, 0, 0.12);
            border-color: rgba(255, 184, 0, 0.4);
            transform: translateY(-1px);
        }

        .btn-fav.active {
            background: #ffb800;
            color: #0b0e14;
            border-color: #ffb800;
        }

        .btn-fav.active:hover {
            background: #e6a500;
            border-color: #e6a500;
        }

        /* Layout a due colonne: lista canali + player */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 24px;
        }

        @media (max-width: 820px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .container { padding: 20px; }
            .header-left h1 { font-size: 20px; }
        }

        /* Lista canali */
        .channel-list-wrapper {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 580px;
        }

        .channel-list-header {
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .channel-list-header span {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            font-weight: 500;
        }

        .channel-list-header .count {
            color: rgba(255, 255, 255, 0.3);
        }

        .channel-list {
            overflow-y: auto;
            flex: 1;
            padding: 4px 0;
            scroll-behavior: smooth;
        }

        .channel-list::-webkit-scrollbar {
            width: 4px;
        }

        .channel-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .channel-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        .channel-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
            gap: 12px;
        }

        .channel-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .channel-item.active-channel {
            background: rgba(255, 184, 0, 0.08);
            border-left-color: #ffb800;
        }

        .channel-item .info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }

        .channel-item .info .logo-wrap {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .channel-item .info .logo-wrap img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .channel-item .info .name {
            color: #e8edf4;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-item .info .group-tag {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 10px;
            border-radius: 100px;
            flex-shrink: 0;
            display: none;
        }

        .channel-item.active-channel .info .group-tag {
            display: inline-block;
        }

        .fav-star {
            font-size: 22px;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
            background: none;
            border: none;
            padding: 0 4px;
            line-height: 1;
            transition: all 0.2s ease;
        }

        .fav-star:hover {
            transform: scale(1.25);
        }

        .fav-star.inactive {
            color: rgba(255, 255, 255, 0.15);
        }

        .fav-star.active {
            color: #ffb800;
            text-shadow: 0 0 20px rgba(255, 184, 0, 0.3);
        }

        .channel-item.active-channel .fav-star.inactive {
            color: rgba(255, 255, 255, 0.2);
        }

        .group-header {
            padding: 8px 18px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.01);
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            display: flex;
            justify-content: space-between;
        }

        .group-header .group-count {
            color: rgba(255, 255, 255, 0.08);
        }

        /* Sezione Player */
        .player-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .player-wrapper {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            background: #0b0e14;
            aspect-ratio: 16 / 9;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .player-wrapper video {
            width: 100%;
            height: 100%;
            display: block;
            background: #0b0e14;
        }

        .player-overlay {
            position: absolute;
            bottom: 16px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .player-overlay .now-playing {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            padding: 6px 16px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .player-overlay .now-playing strong {
            color: #ffffff;
            font-weight: 600;
        }

        .player-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 4px;
        }

        .player-status .hint {
            color: rgba(255, 255, 255, 0.2);
            font-size: 13px;
        }

        .player-status .hint strong {
            color: rgba(255, 255, 255, 0.4);
        }

        /* Stato vuoto */
        .empty-msg {
            padding: 40px 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 15px;
        }

        .empty-msg .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
        }

        .loading-msg {
            padding: 40px 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.15);
        }

        /* Footer */
        .footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .footer span {
            color: rgba(255, 255, 255, 0.15);
            font-size: 13px;
        }

        .footer .dot {
            color: rgba(255, 255, 255, 0.05);
            margin: 0 6px;
        }

        /* Scrollbar global */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }

        /* Animazione pulse per il player in riproduzione */
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4757;
            margin-right: 8px;
            animation: pulse-dot 1.8s ease-in-out infinite;
            vertical-align: middle;
        }

        /* Responsive fine */
        @media (max-width: 480px) {
            body { padding: 12px; }
            .container { padding: 16px; border-radius: 20px; }
            .header-left .logo { width: 40px; height: 40px; font-size: 20px; }
            .header-left h1 { font-size: 18px; }
            .channel-item { padding: 8px 12px; }
            .channel-item .info .logo-wrap { width: 30px; height: 30px; }
            .channel-item .info .logo-wrap img { width: 22px; height: 22px; }
            .channel-item .info .name { font-size: 13px; }
            .fav-star { font-size: 18px; }
            .controls input, .controls select { font-size: 14px; padding: 10px 14px; }
            .btn-fav { font-size: 14px; padding: 10px 16px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <div class="logo">📺</div>
            <h1>IPTV <span>Italia</span></h1>
        </div>
        <div class="header-right">
            <span class="badge" id="statusBadge">📡 <strong id="channelCountHeader">0</strong> canali</span>
            <span class="badge" id="favCounter">⭐ <strong>0</strong> preferiti</span>
        </div>
    </div>

    <!-- CONTROLLI -->
    <div class="controls">
        <input type="text" id="searchInput" placeholder="🔍 Cerca un canale..." oninput="filterChannels()">
        <select id="groupSelect" onchange="filterChannels()">
            <option value="">📂 Tutti i gruppi</option>
        </select>
        <button class="btn-fav" id="showFavBtn">⭐ Solo preferiti</button>
    </div>

    <!-- GRIGLIA PRINCIPALE -->
    <div class="main-grid">
        <!-- LISTA CANALI -->
        <div class="channel-list-wrapper">
            <div class="channel-list-header">
                <span>📋 Canali</span>
                <span class="count" id="channelCounter">0</span>
            </div>
            <div class="channel-list" id="channelList">
                <div class="loading-msg">⏳ Caricamento in corso...</div>
            </div>
        </div>

        <!-- PLAYER -->
        <div class="player-section">
            <div class="player-wrapper">
                <video id="videoPlayer" controls autoplay muted playsinline></video>
                <div class="player-overlay">
                    <span class="now-playing" id="nowPlaying">
                        <span class="live-dot"></span>
                        <strong id="currentChannelName">Nessun canale selezionato</strong>
                    </span>
                </div>
            </div>
            <div class="player-status">
                <span class="hint">
                    💡 Clicca su un canale per riprodurlo
                </span>
                <span class="hint">
                    ⭐ Clicca sulla stella per i <strong>preferiti</strong>
                </span>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <span>📄 Playlist: <strong style="color:rgba(255,255,255,0.3);">lista.m3u</strong></span>
        <span>
            <span id="favStatus">💾 Preferiti salvati nel browser</span>
            <span class="dot">•</span>
            <span>✨ Design by <strong style="color:rgba(255,255,255,0.2);">bro</strong></span>
        </span>
    </div>
</div>

<script>
    // ============================================================
    //  CONFIGURAZIONE
    // ============================================================
    const M3U_FILE = 'lista.m3u';
    const STORAGE_KEY = 'iptv_favorites';

    // ============================================================
    //  VARIABILI
    // ============================================================
    let allChannels = [];
    let filteredChannels = [];
    let groups = new Set();
    let favorites = new Set();
    let hls = null;
    let showOnlyFavorites = false;
    let currentChannelIndex = -1;

    // DOM
    const channelList = document.getElementById('channelList');
    const videoPlayer = document.getElementById('videoPlayer');
    const searchInput = document.getElementById('searchInput');
    const groupSelect = document.getElementById('groupSelect');
    const channelCounter = document.getElementById('channelCounter');
    const channelCountHeader = document.getElementById('channelCountHeader');
    const statusBadge = document.getElementById('statusBadge');
    const favCounter = document.getElementById('favCounter');
    const favStatus = document.getElementById('favStatus');
    const showFavBtn = document.getElementById('showFavBtn');
    const nowPlaying = document.getElementById('nowPlaying');
    const currentChannelName = document.getElementById('currentChannelName');

    // ============================================================
    //  PREFERITI
    // ============================================================
    function loadFavorites() {
        try {
            const data = localStorage.getItem(STORAGE_KEY);
            favorites = data ? new Set(JSON.parse(data)) : new Set();
        } catch { favorites = new Set(); }
        updateFavUI();
    }

    function saveFavorites() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...favorites]));
        updateFavUI();
    }

    function toggleFavorite(channelId) {
        if (favorites.has(channelId)) favorites.delete(channelId);
        else favorites.add(channelId);
        saveFavorites();
        filterChannels();
    }

    function isFavorite(channelId) {
        return favorites.has(channelId);
    }

    function updateFavUI() {
        favCounter.innerHTML = `⭐ <strong>${favorites.size}</strong> preferiti`;
        favStatus.textContent = `💾 ${favorites.size} preferiti salvati`;
        showFavBtn.textContent = showOnlyFavorites ? '⭐ Mostra tutti' : '⭐ Solo preferiti';
        showFavBtn.classList.toggle('active', showOnlyFavorites);
    }

    // ============================================================
    //  PARSER M3U
    // ============================================================
    function parseM3U(text) {
        const lines = text.split('\n');
        const channels = [];
        let current = null;
        let index = 0;

        for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed) continue;

            if (trimmed.startsWith('#EXTINF:')) {
                const nameMatch = trimmed.match(/,(.+)$/);
                const name = nameMatch ? nameMatch[1].trim() : 'Canale senza nome';

                const tvgIdMatch = trimmed.match(/tvg-id="([^"]*)"/);
                const tvgLogoMatch = trimmed.match(/tvg-logo="([^"]*)"/);
                const tvgGroupMatch = trimmed.match(/tvg-group="([^"]*)"/);

                current = {
                    id: `ch_${index++}`,
                    name: name,
                    tvgId: tvgIdMatch ? tvgIdMatch[1] : '',
                    logo: tvgLogoMatch ? tvgLogoMatch[1] : '',
                    group: tvgGroupMatch ? tvgGroupMatch[1] : 'Altro',
                    url: '',
                    userAgent: null
                };
            } else if (trimmed.startsWith('#EXTVLCOPT:http-user-agent=')) {
                if (current) {
                    const uaMatch = trimmed.match(/http-user-agent=(.+)$/);
                    if (uaMatch) current.userAgent = uaMatch[1];
                }
            } else if (!trimmed.startsWith('#') && current) {
                current.url = trimmed;
                if (current.url) channels.push(current);
                current = null;
            }
        }
        return channels;
    }

    // ============================================================
    //  CARICAMENTO
    // ============================================================
    function loadLocalPlaylist() {
        channelList.innerHTML = '<div class="loading-msg">⏳ Caricamento in corso...</div>';

        fetch(M3U_FILE)
            .then(response => {
                if (!response.ok) throw new Error(`File non trovato (HTTP ${response.status})`);
                return response.text();
            })
            .then(text => {
                const channels = parseM3U(text);
                if (channels.length === 0) throw new Error('Nessun canale trovato.');

                allChannels = channels;
                groups.clear();
                allChannels.forEach(ch => { if (ch.group) groups.add(ch.group); });

                groupSelect.innerHTML = '<option value="">📂 Tutti i gruppi</option>';
                [...groups].sort().forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g;
                    opt.textContent = g;
                    groupSelect.appendChild(opt);
                });

                loadFavorites();
                filterChannels();
                statusBadge.innerHTML = `📡 <strong>${allChannels.length}</strong> canali`;
            })
            .catch(error => {
                console.error('Errore:', error);
                channelList.innerHTML = `
                    <div class="empty-msg">
                        <span class="icon">❌</span>
                        <strong>Errore: ${error.message}</strong><br><br>
                        Assicurati che il file <strong>${M3U_FILE}</strong> sia nella STESSA CARTELLA.
                        <br><br>
                        <a href="https://forgejo.it/peppenamir/iptv_italia/raw/branch/main/lista.m3u" target="_blank" style="color:#ffb800;text-decoration:none;">⬇️ Scarica la playlist</a>
                    </div>
                `;
                statusBadge.innerHTML = '❌ Errore';
            });
    }

    // ============================================================
    //  FILTRO E RENDER
    // ============================================================
    function filterChannels() {
        const searchTerm = searchInput.value.toLowerCase().trim();
        const selectedGroup = groupSelect.value;

        filteredChannels = allChannels.filter(ch => {
            const matchName = ch.name.toLowerCase().includes(searchTerm);
            const matchGroup = selectedGroup === '' || ch.group === selectedGroup;
            const matchFav = showOnlyFavorites ? isFavorite(ch.id) : true;
            return matchName && matchGroup && matchFav;
        });

        filteredChannels.sort((a, b) => {
            const aFav = isFavorite(a.id);
            const bFav = isFavorite(b.id);
            if (aFav && !bFav) return -1;
            if (!aFav && bFav) return 1;
            return a.name.localeCompare(b.name);
        });

        renderChannels();
        channelCounter.textContent = `${filteredChannels.length} / ${allChannels.length}`;
        channelCountHeader.textContent = allChannels.length;
        updateFavUI();
    }

    function renderChannels() {
        if (filteredChannels.length === 0) {
            channelList.innerHTML = `<div class="empty-msg"><span class="icon">📭</span>Nessun canale trovato</div>`;
            return;
        }

        let html = '';
        let currentGroup = '';
        let favCount = filteredChannels.filter(ch => isFavorite(ch.id)).length;

        // Preferiti in cima
        if (favCount > 0 && !showOnlyFavorites) {
            const favChannels = filteredChannels.filter(ch => isFavorite(ch.id));
            html += `<div class="group-header" style="color:#ffb800; border-bottom:1px solid rgba(255,184,0,0.1);">
                ⭐ Preferiti <span class="group-count">${favCount}</span>
            </div>`;
            favChannels.forEach((ch, idx) => {
                html += renderChannelItem(ch, idx);
            });
            // Separatore
            html += `<div style="border-bottom:1px solid rgba(255,255,255,0.03); margin:4px 12px;"></div>`;
        }

        // Altri canali
        const others = showOnlyFavorites 
            ? filteredChannels 
            : filteredChannels.filter(ch => !isFavorite(ch.id));

        others.forEach((ch, idx) => {
            if (ch.group !== currentGroup) {
                currentGroup = ch.group;
                const count = others.filter(c => c.group === currentGroup).length;
                html += `<div class="group-header">📁 ${ch.group} <span class="group-count">${count}</span></div>`;
            }
            html += renderChannelItem(ch, idx);
        });

        channelList.innerHTML = html;
    }

    function renderChannelItem(ch, index) {
        const isFav = isFavorite(ch.id);
        const isActive = (currentChannelIndex === index);
        const logoHtml = ch.logo 
            ? `<img src="${ch.logo}" onerror="this.style.display='none'" loading="lazy">` 
            : '';

        const starClass = isFav ? 'active' : 'inactive';
        const starSymbol = isFav ? '⭐' : '☆';

        return `
            <div class="channel-item ${isActive ? 'active-channel' : ''}" data-index="${index}" onclick="selectChannel(${index})">
                <div class="info">
                    <div class="logo-wrap">${logoHtml}</div>
                    <span class="name">${ch.name}</span>
                    <span class="group-tag">${ch.group}</span>
                </div>
                <button class="fav-star ${starClass}" onclick="event.stopPropagation(); toggleFavoriteById('${ch.id}')" title="Aggiungi/rimuovi preferito">
                    ${starSymbol}
                </button>
            </div>
        `;
    }

    // ============================================================
    //  SELEZIONE CANALE
    // ============================================================
    function selectChannel(index) {
        currentChannelIndex = index;
        const channel = filteredChannels[index];
        if (!channel || !channel.url) return;

        // Aggiorna UI
        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active-channel'));
        const items = document.querySelectorAll('.channel-item');
        if (items[index]) items[index].classList.add('active-channel');

        // Aggiorna "ora in riproduzione"
        currentChannelName.textContent = channel.name;

        // Distruggi hls
        if (hls) { hls.destroy(); hls = null; }

        const url = channel.url;
        const isHls = url.includes('.m3u8');
        const isMpd = url.includes('.mpd');
        const isYoutube = url.includes('youtube.com') || url.includes('twitch.tv');

        if (isYoutube) {
            videoPlayer.pause();
            videoPlayer.src = '';
            alert(`⚠️ "${channel.name}" è un live YouTube/Twitch. Aprilo nel browser.`);
            return;
        }

        if (isMpd) {
            videoPlayer.pause();
            videoPlayer.src = '';
            alert(`⚠️ "${channel.name}" usa DASH (.mpd). Usa VLC.`);
            return;
        }

        if (isHls) {
            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(videoPlayer);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    videoPlayer.play().catch(e => console.warn(e));
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        console.error('Errore hls.js:', data);
                        alert(`❌ Impossibile riprodurre "${channel.name}". Potrebbe richiedere user-agent. Usa VLC.`);
                    }
                });
                return;
            }
        }

        videoPlayer.src = url;
        videoPlayer.play().catch(error => {
            console.warn('Riproduzione fallita:', error);
            if (channel.userAgent) {
                alert(`⚠️ "${channel.name}" richiede user-agent: ${channel.userAgent}. Usa VLC.`);
            }
        });
    }

    function toggleFavoriteById(id) {
        toggleFavorite(id);
    }

    // ============================================================
    //  PULSANTE PREFERITI
    // ============================================================
    showFavBtn.addEventListener('click', function() {
        showOnlyFavorites = !showOnlyFavorites;
        filterChannels();
    });

    // ============================================================
    //  AVVIO
    // ============================================================
    loadLocalPlaylist();
</script>
</body>
</html>
